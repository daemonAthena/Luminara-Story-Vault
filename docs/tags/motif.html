          function luminaraParts(){
            const months=["Blossoming","Flurry","Dreaming","Luminary","Sweetening","Sagacity","Gilding","Frigidity","Silvering","Nocturn","Umbery","Emerging","Transition"];
            const days=["Artemsday","Lunasday","Zeiasday","Daciasday","Athensday","Neosday"];
            const d=new Date();
            let y=d.getFullYear();
            let start=new Date(y,3,20);
            if(d<start){ y--; start=new Date(y,3,20); }
            const leap = ((y+1)%4===0 && ((y+1)%100!==0 || (y+1)%400===0));
            const lengths=[30,30,30,30,30,30,30,30,30,30,30,30, leap?6:5];
            const doy=Math.floor((d-start)/86400000)+1;
            let acc=0,m,dom;
            for(let i=0;i<months.length;i++){ if(doy<=acc+lengths[i]){ m=months[i]; dom=doy-acc; break;} acc+=lengths[i]; }
            return {month:m, day:dom, weekday: days[(doy-1)%6]};
          }
          function luminaraDate(){
            const months=["Blossoming","Flurry","Dreaming","Luminary","Sweetening","Sagacity","Gilding","Frigidity","Silvering","Nocturn","Umbery","Emerging","Transition"];
            const days=["Artemsday","Lunasday","Zeiasday","Daciasday","Athensday","Neosday"];
            const d=new Date();
            let y=d.getFullYear();
            let start=new Date(y,3,20);
            if(d<start){ y--; start=new Date(y,3,20); }
            const leap = ((y+1)%4===0 && ((y+1)%100!==0 || (y+1)%400===0));
            const lengths=[30,30,30,30,30,30,30,30,30,30,30,30, leap?6:5];
            const doy=Math.floor((d-start)/86400000)+1;
            let acc=0,m,dom;
            for(let i=0;i<months.length;i++){ if(doy<=acc+lengths[i]){ m=months[i]; dom=doy-acc; break;} acc+=lengths[i]; }
            const n=y-2020;
            const era = n<=299?'E1': n<=599?'E2':'E3';
            return m+" "+dom+", Year "+n+" "+era+" — "+days[(doy-1)%6];
          }

                    function mountBar(){
                      const old=document.getElementById('luminara-bar'); if(old) old.remove();
                      const bar=document.createElement('div');
                      bar.id='luminara-bar';
                      bar.style.cssText='height:40px;background:linear-gradient(90deg,#1e1e2e,#313244);color:#cdd6f4;font-family:monospace;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px;margin-bottom:10px;border-radius:6px;border:1px solid #45475a;letter-spacing:0.5px;text-align:center;';

                      const todayLabel = lumLabelFor(parts.month, parts.day);
                      const override = barOverrides[parts.month+"-"+parts.day] || ""; // set to override the auto label
                      const holiday = override || todayLabel.replace(/<[^>]*>/g,'');
                      const monthColor = monthColors[parts.month] || '#cdd6f4';
                      const dayColor = dayColors[parts.weekday] || '#cdd6f4';
                      const coloredDate = luminaraDate().replace(parts.month, '<span style="color:'+monthColor+';">'+parts.month+'</span>').replace(parts.weekday, '<span style="color:'+dayColor+';">'+parts.weekday+'</span>');
                      bar.innerHTML = '<div>'+coloredDate+'</div>' + (holiday ? '<div style="font-size:11px;font-weight:400;opacity:.85;">'+holiday+'</div>' : '');
                      const bc=document.querySelector('div.center nav.breadcrumb-container, div.center .breadcrumb-container, nav.breadcrumb-container');
                      if(bc && bc.parentNode){ bc.parentNode.insertBefore(bar, bc); }
                      else { const center=document.querySelector('div.center'); if(center){ center.prepend(bar); } else { document.body.prepend(bar); } }

                    function renderLumCalendar(){
                      const root=document.getElementById('lum-calendar');
                      if(!root) return;
                      let html='';
                      lumMonths.forEach(m=>{
                        const cols = m.d===5?5:6;
